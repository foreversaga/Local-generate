[program:ollama]
command=/opt/supervisor-scripts/ollama.sh
directory=/workspace
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/ollama.log
stderr_logfile=/var/log/ollama.err.log
environment=HOME="/root",OLLAMA_HOST="127.0.0.1:11434",OLLAMA_MODELS="/workspace/ollama-models",OLLAMA_KEEP_ALIVE="0",OLLAMA_NO_CLOUD="true",OLLAMA_MAX_LOADED_MODELS="1"
