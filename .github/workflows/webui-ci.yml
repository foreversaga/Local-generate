name: WebUI CI

on:
  push:
    branches:
      - main
      - agent/document-webui-redesign-plan
  pull_request:
    branches:
      - main
      - agent/document-webui-redesign-plan
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  test:
    name: WebUI quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Archive source snapshot
        run: git archive --format=tar.gz --output=source-snapshot.tar.gz HEAD

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: source-${{ github.sha }}
          path: source-snapshot.tar.gz
          retention-days: 1
          if-no-files-found: error

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm ci

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Build
        id: build
        continue-on-error: true
        run: npm run build

      - name: Unit and domain behavior tests
        id: unit
        continue-on-error: true
        run: npm run test:unit

      - name: Start WebUI for route smoke
        id: server
        continue-on-error: true
        run: |
          nohup npm run dev -- --host 127.0.0.1 > webui.log 2>&1 &
          echo $! > webui.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8787/app/api/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat webui.log
          exit 1

      - name: WebUI route and health smoke
        id: smoke
        continue-on-error: true
        env:
          H3_STUDIO_BASE_URL: http://127.0.0.1:8787
        run: npm run web:smoke

      - name: Capture quality gate outcomes
        if: always()
        run: |
          cat > quality-gate-outcomes.txt <<'EOF'
          install=${{ steps.install.outcome }}
          lint=${{ steps.lint.outcome }}
          build=${{ steps.build.outcome }}
          unit=${{ steps.unit.outcome }}
          server=${{ steps.server.outcome }}
          smoke=${{ steps.smoke.outcome }}
          EOF

      - name: Upload quality gate outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-outcomes-${{ github.sha }}
          path: quality-gate-outcomes.txt
          retention-days: 1
          if-no-files-found: error

      - name: Publish commit status
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          UNIT_OUTCOME: ${{ steps.unit.outcome }}
          SERVER_OUTCOME: ${{ steps.server.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          if [ "$INSTALL_OUTCOME" = "success" ] && \
             [ "$LINT_OUTCOME" = "success" ] && \
             [ "$BUILD_OUTCOME" = "success" ] && \
             [ "$UNIT_OUTCOME" = "success" ] && \
             [ "$SERVER_OUTCOME" = "success" ] && \
             [ "$SMOKE_OUTCOME" = "success" ]; then
            STATE="success"
            DESCRIPTION="WebUI install, lint, build, unit tests, and route smoke passed"
          else
            STATE="failure"
            DESCRIPTION="WebUI quality gate failed"
          fi
          TARGET_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          PAYLOAD="$(jq -n \
            --arg state "$STATE" \
            --arg context "WebUI CI" \
            --arg description "$DESCRIPTION" \
            --arg target_url "$TARGET_URL" \
            '{state:$state, context:$context, description:$description, target_url:$target_url}')"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$PAYLOAD"

      - name: Enforce quality gate
        if: steps.install.outcome != 'success' || steps.lint.outcome != 'success' || steps.build.outcome != 'success' || steps.unit.outcome != 'success' || steps.server.outcome != 'success' || steps.smoke.outcome != 'success'
        run: exit 1
