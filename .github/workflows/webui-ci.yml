name: WebUI CI

on:
  push:
    branches:
      - agent/document-webui-redesign-plan
  pull_request:
    branches:
      - agent/document-webui-redesign-plan
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install, build, and run tests
        id: validate
        continue-on-error: true
        run: npm ci && npm test

      - name: Publish commit status
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
        run: |
          if [ "$VALIDATION_OUTCOME" = "success" ]; then
            STATE="success"
            DESCRIPTION="WebUI build and tests passed"
          else
            STATE="failure"
            DESCRIPTION="WebUI build or tests failed"
          fi
          TARGET_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          PAYLOAD="$(jq -n \
            --arg state "$STATE" \
            --arg context "WebUI CI" \
            --arg description "$DESCRIPTION" \
            --arg target_url "$TARGET_URL" \
            '{state:$state, context:$context, description:$description, target_url:$target_url}')"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$PAYLOAD"

      - name: Enforce validation result
        if: steps.validate.outcome != 'success'
        run: exit 1
