name: SeedVR2 FP16 UI Bootstrap

on:
  push:
    branches:
      - codex/seedvr2-fp16-ui-final

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/seedvr2-fp16-ui-final
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Apply FP16 UI patch
        run: python3 scripts/apply-seedvr2-fp16-ui.py

      - name: Remove temporary bootstrap files
        run: rm -f scripts/apply-seedvr2-fp16-ui.py .github/workflows/seedvr2-fp16-ui-bootstrap.yml

      - name: Install dependencies
        run: npm ci

      - name: Run SeedVR2 UI tests
        run: node --test tests/seedvr2-settings-ui.test.mjs

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit verified UI changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add SeedVR2 7B Sharp FP16 UI"
          git push origin HEAD:codex/seedvr2-fp16-ui-final
