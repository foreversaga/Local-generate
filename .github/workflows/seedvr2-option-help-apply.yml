name: Apply SeedVR2 option help

# Kept only on the feature branch while the verified patch is applied.
on:
  push:
    branches:
      - codex/seedvr2-option-help

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/seedvr2-option-help
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Apply SeedVR2 help UI changes
        run: python3 scripts/apply-seedvr2-option-help.py

      - name: Remove temporary patch files
        run: rm -f scripts/apply-seedvr2-option-help.py .github/workflows/seedvr2-option-help-apply.yml

      - name: Install dependencies
        run: npm ci

      - name: Run SeedVR2 UI tests
        run: node --test tests/seedvr2-settings-ui.test.mjs

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/tools/UpscaleWorkspace.tsx app/components/tools/UpscaleWorkspace.module.css tests/seedvr2-settings-ui.test.mjs scripts/apply-seedvr2-option-help.py .github/workflows/seedvr2-option-help-apply.yml
          git commit -m "Explain SeedVR2 adjustment options"
          git push origin HEAD:codex/seedvr2-option-help
