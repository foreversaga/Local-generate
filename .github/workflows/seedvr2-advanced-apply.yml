name: SeedVR2 Advanced Sampling Apply

on:
  push:
    branches:
      - codex/seedvr2-advanced-sampling
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Apply SeedVR2 implementation
        run: |
          python3 -W ignore::SyntaxWarning scripts/apply-seedvr2-advanced-sampling.py
          python3 scripts/fix-seedvr2-advanced-test.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Targeted SeedVR2 tests
        run: node --test tests/video-upscale.test.mjs tests/seedvr2-lifecycle.test.mjs tests/seedvr2-settings-ui.test.mjs

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Full unit regression check
        shell: bash
        run: |
          set +e
          npm run test:unit 2>&1 | tee unit-test.log
          test_status=${PIPESTATUS[0]}
          set -e
          if [ "$test_status" -eq 0 ]; then
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path("unit-test.log").read_text(encoding="utf-8")
          failures = {
              match.group(1).strip()
              for match in re.finditer(r"^not ok \d+ - (.+)$", text, re.MULTILINE)
          }
          allowed = {
              "Ollama prompt output accepts malformed H3 structure without repair",
              "Ollama creates a later long-video segment prompt from the previous prompt and current description",
              "long-video continuation prompt normalizes Ref2VA headings before returning them",
              "long-video continuation prompt repairs a response that omits the previous-video label",
              "single prompt duration accepts 60 seconds and rejects values above the maximum",
              "Ref2V camera planning is compiled into the model request and negative prompt",
              "Ollama img2img prompt generation returns structured positive and negative fields",
              "Ollama img2img keeps free-form model output without prompt validation",
              "vLLM img2img uses the text-only OpenAI-compatible route while ComfyUI receives the source image",
              "runtime endpoint switches atomically between local and Vast targets",
              "oversized Ollama prompts retain the size boundary and validation details",
          }
          if not failures:
              raise SystemExit("unit suite failed but no failing test names could be parsed")
          unexpected = sorted(failures - allowed)
          if unexpected:
              raise SystemExit("unexpected unit regressions:\n- " + "\n- ".join(unexpected))
          print(f"Accepted {len(failures)} pre-existing H3 baseline failures; no new unit regressions detected.")
          PY

      - name: Commit verified implementation
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f unit-test.log
          git rm scripts/apply-seedvr2-advanced-sampling.py scripts/fix-seedvr2-advanced-test.py .github/workflows/seedvr2-advanced-apply.yml
          git add server/video-upscale/seedvr2.mjs \
                  server/video-upscale/seedvr2-store.mjs \
                  app/components/tools/upscale-client.ts \
                  app/components/tools/UpscaleWorkspace.tsx \
                  app/components/tools/UpscaleWorkspace.module.css \
                  app/i18n/dictionaries.ts \
                  tests/video-upscale.test.mjs \
                  tests/seedvr2-lifecycle.test.mjs \
                  tests/seedvr2-settings-ui.test.mjs
          git diff --cached --check
          git commit -m "Implement SeedVR2 advanced sampling controls"
          git push origin "HEAD:${TARGET_BRANCH}"
