name: Remove Krea Once

on:
  push:
    branches:
      - feat/remove-krea-text2img-option
    paths:
      - .github/workflows/remove-krea-once.yml
      - .github/tmp/remove-krea/**

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/remove-krea-text2img-option
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Apply exact removal patch
        shell: bash
        run: |
          cat .github/tmp/remove-krea/part-*.patch > /tmp/remove-krea.patch
          git apply --check /tmp/remove-krea.patch
          git apply /tmp/remove-krea.patch
          if git grep -n -E 'Krea|KREA|krea2|krea_' -- . ':(exclude).github/tmp/remove-krea/**' ':(exclude).github/workflows/remove-krea-once.yml'; then
            echo "Krea references remain." >&2
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Text-to-image tests
        run: node --test tests/text2img.test.mjs tests/text2img-ui.test.mjs
      - name: Commit clean source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/tools/TextToImageWorkspace.tsx \
            app/components/tools/text2img-client.ts \
            app/i18n/dictionaries.ts \
            server/image-generation/text2img.mjs \
            tests/text2img-ui.test.mjs \
            tests/text2img.test.mjs
          git diff --cached --check
          git commit -m "Remove Krea text-to-image support"
          git push origin HEAD:feat/remove-krea-text2img-option
